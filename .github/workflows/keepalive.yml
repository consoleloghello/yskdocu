name: Supabase Keepalive

on:
  schedule:
    # 每 5 天执行一次 (UTC 时间 8:00)，防止 7 天无活动被暂停
    - cron: '0 8 */5 * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          SUPABASE_URL="https://fbzfcjvzivivupmnqqpp.supabase.co"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          echo "Pinging Supabase project..."

          # 请求 profiles 表（轻量查询，保持数据库活跃）
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/profiles?limit=1")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "401" ]; then
            echo "✅ Keepalive ping successful"
          else
            echo "⚠️  Unexpected response: ${HTTP_CODE}"
          fi
