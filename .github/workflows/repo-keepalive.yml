name: Repo Keepalive

on:
  schedule:
    # 每月 1 号 UTC 0:00 做一次空提交，刷新「仓库活跃度」，
    # 防止 GitHub 在 60 天无提交后自动停用所有 schedule 定时任务
    # （连带停用上面的 Supabase Keepalive）。
    - cron: '0 0 1 * *'
  workflow_dispatch:  # 允许手动触发

# 仅需要写权限，用于提交时间戳文件
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump keepalive timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive
          if git diff --cached --quiet; then
            echo "时间戳未变化，跳过提交。"
          else
            git commit -m "chore: 刷新 keepalive 时间戳（防 60 天停用定时任务）"
            git push
          fi
