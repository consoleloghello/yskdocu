<!DOCTYPE html>
<!--
    Synthetic Flux — Sci-Fi generative flow-field particle system
    Based on: background-fluid-memory.js (Flowing Memory / Fluid Memory)
    Philosophy: docs/algorithmic-philosophy-synthetic-flux.md
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetic Flux — Generative Data-Flow Topology</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a12 0%, #12121e 100%);
            min-height: 100vh;
            color: #e8e6dc;
        }
        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar — dark theme variant */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(18, 18, 30, 0.92);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(100, 120, 255, 0.08);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: #f0f0ff;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .sidebar .subtitle {
            color: #8888bb;
            font-size: 13px;
            margin-bottom: 28px;

        }

        .control-section {
            margin-bottom: 28px;
        }
        .control-section h3 {
            font-size: 15px;
            font-weight: 600;
            color: #d0d0f0;
            margin-bottom: 14px;

        }
        .control-section h3::before {

        .seed-input {

        .slider-container input[type="range"] {

        .slider-container input[type="range"]::-webkit-slider-thumb {

        }
        .slider-container input[type="range"]::-moz-range-thumb {

        .color-group { margin-bottom: 14px; }

        }
        .color-picker-container {
            display: flex;

        }
        .color-picker-container input[type="color"] {
            width: 32px; height: 32px;
            border: 1px solid rgba(100, 120, 255, 0.2);
            border-radius: 6px;

        }
        .color-value {
            font-family: 'Courier New', monospace;

        }

        .button {
            background: linear-gradient(135deg, #00c8ff, #0066ff);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;

        }
        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 200, 255, 0.25);
        }
        .button:active { transform: translateY(0); }
        .button.secondary {
            background: rgba(100, 120, 255, 0.15);

            border: 1px solid rgba(100, 120, 255, 0.12);
        }
        .button.secondary:hover {

        }
        .button.tertiary {

        }
        .button.tertiary:hover {
            box-shadow: 0 4px 16px rgba(255, 51, 102, 0.25);
        }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            background: #0a0a12;
            border: 1px solid rgba(100, 120, 255, 0.06);
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 300px 20px;
            font-size: 16px;
            color: #6666aa;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Synthetic Flux</h1>
            <div class="subtitle">Generative data-flow topology · machine-dream particles</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="300" max="4000" step="100" value="1800" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1800</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.3" max="4.0" step="0.1" value="1.8" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">1.8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.012" step="0.0005" value="0.003" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.003</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0.0" max="1.0" step="0.05" value="0.55" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.55</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Length</label>
                    <div class="slider-container">
                        <input type="range" id="trailOpacity" min="2" max="30" step="1" value="14" oninput="updateParam('trailOpacity', this.value)">
                        <span class="value-display" id="trailOpacity-value">14</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Burst Rate</label>
                    <div class="slider-container">
                        <input type="range" id="burstRate" min="0" max="0.04" step="0.002" value="0.01" oninput="updateParam('burstRate', this.value)">
                        <span class="value-display" id="burstRate-value">0.01</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Grid Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="gridOpacity" min="0" max="0.2" step="0.005" value="0.06" oninput="updateParam('gridOpacity', this.value)">
                        <span class="value-display" id="gridOpacity-value">0.06</span>
                    </div>
                </div>
            </div>

            <!-- Colors -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="control-group">
                    <label>Cyan Hue (data packets)</label>
                    <div class="slider-container">
                        <input type="range" id="hueCyan" min="170" max="230" step="1" value="195" oninput="updateParam('hueCyan', this.value)">
                        <span class="value-display" id="hueCyan-value">195</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Magenta Hue (signals)</label>
                    <div class="slider-container">
                        <input type="range" id="hueMagenta" min="270" max="330" step="1" value="305" oninput="updateParam('hueMagenta', this.value)">
                        <span class="value-display" id="hueMagenta-value">305</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Saturation</label>
                    <div class="slider-container">
                        <input type="range" id="saturation" min="50" max="100" step="2" value="88" oninput="updateParam('saturation', this.value)">
                        <span class="value-display" id="saturation-value">88</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Brightness</label>
                    <div class="slider-container">
                        <input type="range" id="brightness" min="50" max="100" step="2" value="92" oninput="updateParam('brightness', this.value)">
                        <span class="value-display" id="brightness-value">92</span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">⟲ Reset</button>
                    <button class="button secondary" onclick="exportImage()">⬇ PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">◈ INITIALIZING SYNTHETIC FLUX ◈</div>
            </div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════════════
    // PARAMETERS
    // ═══════════════════════════════════════════════════════════════════════

    var params = {
        seed: 12345,
        particleCount: 1800,
        flowSpeed: 1.8,
        noiseScale: 0.003,
        turbulence: 0.55,
        trailOpacity: 14,
        burstRate: 0.01,
        gridOpacity: 0.06,
        hueCyan: 195,
        hueMagenta: 305,
        saturation: 88,
        brightness: 92
    };

    var defaultParams = JSON.parse(JSON.stringify(params));

    // ═══════════════════════════════════════════════════════════════════════
    // P5.JS SKETCH — instance mode (p5inst.* for all p5 functions)
    // ═══════════════════════════════════════════════════════════════════════

    var particles = [];
    var flowField = [];
    var cols, rows;
    var scl = 18;
    var pg;
    var p5inst = null;

    // ─── Particle Class ────────────────────────────────────────────────

    var Particle = function () {
        this.reset = function () {
            this.x = p5inst.random(p5inst.width);
            this.y = p5inst.random(p5inst.height);
            this.prevX = this.x;
            this.prevY = this.y;
            this.vx = 0;
            this.vy = 0;
            this.age = 0;
            this.maxAge = 280 + Math.floor(p5inst.random(180));
            this.bursting = false;
            this.alpha = 255;
        };

        this.reset();

        // Data type: 0=packet, 1=signal, 2=glitch
        var typeRoll = Math.floor(p5inst.random(100));
        if (typeRoll < 55) this.type = 0;
        else if (typeRoll < 85) this.type = 1;
        else this.type = 2;
        this.glitchTimer = Math.floor(p5inst.random(20, 80));
    };

    Particle.prototype.follow = function (v) {
        var spd = params.flowSpeed * 0.1;
        this.vx += v.x * spd;
        this.vy += v.y * spd;

        if (this.type === 1) {
            this.vx += v.x * spd * 0.6;
            this.vy += v.y * spd * 0.6;
        } else if (this.type === 2) {
            this.glitchTimer--;
            if (this.glitchTimer <= 0) {
                this.vx += (p5inst.random() - 0.5) * 3.0;
                this.vy += (p5inst.random() - 0.5) * 3.0;
                this.glitchTimer = Math.floor(p5inst.random(8, 50));
            }
        }

        this.vx *= 0.90;
        this.vy *= 0.90;

        if (this.bursting) {
            this.burstTimer--;
            if (this.burstTimer <= 0) this.bursting = false;
        }
    };

    Particle.prototype.triggerBurst = function () {
        if (!this.bursting) {
            this.bursting = true;
            this.burstTimer = Math.floor(p5inst.random(8, 25));
            var angle = Math.atan2(this.vy, this.vx) + (p5inst.random() - 0.5) * 0.8;
            var force = 4 + p5inst.random() * 6;
            this.vx += Math.cos(angle) * force;
            this.vy += Math.sin(angle) * force;
        }
    };

    Particle.prototype.update = function () {
        this.prevX = this.x;
        this.prevY = this.y;
        this.x += this.vx;
        this.y += this.vy;
        this.age++;

        var lifeRatio = this.age / this.maxAge;
        this.alpha = lifeRatio > 0.7 ? p5inst.map(lifeRatio, 0.7, 1.0, 255, 0) : 255;

        if (this.x < 0) { this.x += p5inst.width; this.prevX = this.x; }
        if (this.x > p5inst.width) { this.x -= p5inst.width; this.prevX = this.x; }
        if (this.y < 0) { this.y += p5inst.height; this.prevY = this.y; }
        if (this.y > p5inst.height) { this.y -= p5inst.height; this.prevY = this.y; }

        if (this.age >= this.maxAge) this.reset();
    };

    Particle.prototype.getSpeed = function () {
        return Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    };

    Particle.prototype.getHue = function () {
        var speed = this.getSpeed();
        var spdNorm = Math.min(speed / 8, 1);
        if (this.type === 0) {
            return params.hueCyan + spdNorm * 20;
        } else if (this.type === 1) {
            return params.hueMagenta - spdNorm * 30;
        } else {
            var osc = Math.sin(this.age * 0.05) * 0.5 + 0.5;
            return p5inst.lerp(params.hueCyan, params.hueMagenta, osc);
        }
    };

    Particle.prototype.getLineWidth = function () {
        var spd = this.getSpeed();
        if (this.bursting) return p5inst.map(spd, 0, 12, 1.0, 3.5);
        if (this.type === 1) return 1.4;
        if (this.type === 2) return 0.8 + p5inst.random() * 0.6;
        return 1.0;
    };

    Particle.prototype.getAlpha = function () {
        var base = this.alpha * 0.65;
        if (this.bursting) return p5inst.constrain(base * 2, 0, 255);
        if (this.type === 1) return base * 1.2;
        return base;
    };

    // ─── Flow Field ────────────────────────────────────────────────────

    function buildFlowField(t) {
        var nOff = t * 0.00025;
        for (var y = 0; y < rows; y++) {
            for (var x = 0; x < cols; x++) {
                var idx = x + y * cols;
                var px = x * scl;
                var py = y * scl;

                var n1 = p5inst.noise(px * params.noiseScale + nOff, py * params.noiseScale + 100);
                var n2 = p5inst.noise(px * params.noiseScale * 2.3 + 50 + nOff * 0.65, py * params.noiseScale * 2.3 + 200);
                var n3 = p5inst.noise(px * params.noiseScale * 5.1 + 300 + nOff * 0.4, py * params.noiseScale * 5.1 + 400);

                var n = p5inst.lerp(n1, n2, params.turbulence);
                n = p5inst.lerp(n, n3, params.turbulence * 0.4);

                var sinMod = Math.sin(px * 0.008 + py * 0.006 + t * 0.0004) * 0.35;
                var angle = n * p5inst.TWO_PI * 2 + sinMod * p5inst.PI;

                flowField[idx] = p5inst.createVector(Math.cos(angle), Math.sin(angle));
            }
        }
    }

    // ─── Grid ──────────────────────────────────────────────────────────

    function drawGrid(p, t) {
        var op = params.gridOpacity;
        if (op < 0.001) return;

        var gridSize = 45;
        var pulse = Math.sin(t * 0.015) * 0.25 + 0.75;
        var baseAlpha = op * 255 * pulse;

        p.push();
        // Grid uses RGB (canvas default is HSB, override here)
        p.colorMode(p.RGB);
        p.noFill();

        var lineAlpha = baseAlpha * 0.6;
        p.stroke(120, 160, 255, lineAlpha);
        p.strokeWeight(0.4);

        for (var x = 0; x <= p.width; x += gridSize) {
            p.line(x, 0, x, p.height);
        }
        for (var y = 0; y <= p.height; y += gridSize) {
            p.line(0, y, p.width, y);
        }

        var dotAlpha = baseAlpha * 0.5;
        p.fill(180, 210, 255, dotAlpha);
        p.noStroke();
        for (var x = gridSize; x < p.width; x += gridSize) {
            for (var y = gridSize; y < p.height; y += gridSize) {
                var d = 0.8 + Math.sin(x * 0.03 + y * 0.04 + t * 0.02) * 0.4;
                p.circle(x, y, d);
            }
        }

        p.stroke(180, 220, 255, baseAlpha * 0.3);
        p.strokeWeight(0.6);
        p.line(p.width / 2, 0, p.width / 2, p.height);
        p.line(0, p.height / 2, p.width, p.height / 2);

        p.pop();
    }

    // ─── Init ──────────────────────────────────────────────────────────

    function initializeSystem() {
        p5inst.randomSeed(params.seed);
        p5inst.noiseSeed(params.seed);

        particles = [];
        cols = Math.floor(p5inst.width / scl) + 1;
        rows = Math.floor(p5inst.height / scl) + 1;
        flowField = new Array(cols * rows);

        buildFlowField(0);

        for (var i = 0; i < params.particleCount; i++) {
            particles.push(new Particle());
        }

        if (pg) {
            pg.background(0, 0, 0, 255);
        }
    }

    // ─── Sketch (instance mode) ────────────────────────────────────────

    var sketch = function (p) {
        p5inst = p;

        p.setup = function () {
            var container = document.getElementById('canvas-container');
            var w = container.offsetWidth || 1000;
            var h = Math.round(w * 0.85);
            var canvas = p.createCanvas(w, h);
            canvas.parent('canvas-container');
            canvas.style('display', 'block');
            p.colorMode(p.HSB, 360, 100, 100, 255);

            pg = p.createGraphics(w, h);
            pg.colorMode(p.HSB, 360, 100, 100, 255);
            pg.background(0, 0, 0, 255);

            initializeSystem();
            var loadingEl = document.querySelector('.loading');
            if (loadingEl) loadingEl.style.display = 'none';
        };

        p.draw = function () {
            buildFlowField(p.frameCount);

            // Trail fade on offscreen buffer
            pg.push();
            pg.noStroke();
            pg.fill(0, 0, 0, params.trailOpacity);
            pg.rect(0, 0, p.width, p.height);
            pg.pop();

            // Draw particles to offscreen buffer
            for (var i = 0; i < particles.length; i++) {
                var pt = particles[i];
                var col = Math.floor(pt.x / scl);
                var row = Math.floor(pt.y / scl);
                var idx = p.constrain(col, 0, cols - 1) + p.constrain(row, 0, rows - 1) * cols;
                var v = flowField[idx];
                if (v) pt.follow(v);

                pt.update();

                var speed = pt.getSpeed();
                var spdNorm = Math.min(speed / 7, 1);
                var hue = pt.getHue();
                var sat = params.saturation - (1 - spdNorm) * 15;
                var bri = params.brightness - (1 - spdNorm) * 25;
                var alphaVal = pt.getAlpha();

                pg.push();
                var lw = pt.getLineWidth();
                pg.strokeWeight(lw);
                pg.stroke(hue, sat, bri, alphaVal);
                pg.line(pt.prevX, pt.prevY, pt.x, pt.y);

                if (pt.bursting) {
                    pg.noStroke();
                    pg.fill(hue, sat, 100, alphaVal * 0.5);
                    pg.circle(pt.x, pt.y, lw * 4);
                }
                pg.pop();

                if (params.burstRate > 0 && pt.type > 0 && p5inst.random() < params.burstRate * 0.3) {
                    pt.triggerBurst();
                }
            }

            p.background(0, 0, 3, 255);

            p.push();
            p.blendMode(p.SCREEN);
            p.image(pg, 0, 0);
            p.pop();

            // Ambient glow
            p.push();
            p.noStroke();
            var ambientGlow = Math.sin(p.frameCount * 0.008) * 0.02 + 0.03;
            var grd = p.drawingContext.createRadialGradient(
                p.width / 2, p.height / 2, 0,
                p.width / 2, p.height / 2, p.width * 0.6
            );
            grd.addColorStop(0, 'rgba(50, 60, 120, ' + ambientGlow + ')');
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            p.drawingContext.fillStyle = grd;
            p.rect(0, 0, p.width, p.height);
            p.pop();

            drawGrid(p, p.frameCount);
        };

        p.windowResized = function () {
            var container = document.getElementById('canvas-container');
            var w = container.offsetWidth || 1000;
            var h = Math.round(w * 0.85);
            p.resizeCanvas(w, h);
            cols = Math.floor(w / scl) + 1;
            rows = Math.floor(h / scl) + 1;
            flowField = new Array(cols * rows);
            pg = p.createGraphics(w, h);
            pg.colorMode(p.HSB, 360, 100, 100, 255);
            pg.background(0, 0, 0, 255);
            initializeSystem();
        };
    };

    // ─── Launch ────────────────────────────────────────────────────────

    function launchSketch() {
        new p5(sketch);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', launchSketch);
    } else {
        launchSketch();
    }

    // ═══════════════════════════════════════════════════════════════════════
    // UI HANDLERS
    // ═══════════════════════════════════════════════════════════════════════

    function updateParam(name, value) {
        var numVal = parseFloat(value);
        params[name] = numVal;
        var display = document.getElementById(name + '-value');
        if (display) {
            display.textContent = numVal % 1 === 0 ? numVal : numVal.toFixed(numVal < 1 ? 3 : 1);
        }
    }

    function updateSeedDisplay() {
        document.getElementById('seed-input').value = params.seed;
    }

    function updateSeed() {
        var input = document.getElementById('seed-input');
        var newSeed = parseInt(input.value);
        if (newSeed && newSeed > 0) {
            params.seed = newSeed;
            initializeSystem();
        } else {
            updateSeedDisplay();
        }
    }

    function previousSeed() {
        params.seed = Math.max(1, params.seed - 1);
        updateSeedDisplay();
        initializeSystem();
    }

    function nextSeed() {
        params.seed += 1;
        updateSeedDisplay();
        initializeSystem();
    }

    function randomSeedAndUpdate() {
        params.seed = Math.floor(Math.random() * 999999) + 1;
        updateSeedDisplay();
        initializeSystem();
    }

    function resetParameters() {
        params = JSON.parse(JSON.stringify(defaultParams));

        for (var key in params) {
            if (params.hasOwnProperty(key)) {
                var el = document.getElementById(key);
                if (el && el.type === 'range') {
                    el.value = params[key];
                }
                var display = document.getElementById(key + '-value');
                if (display) {
                    var val = params[key];
                    display.textContent = val % 1 === 0 ? val : val.toFixed(val < 1 ? 3 : 1);
                }
            }
        }

        updateSeedDisplay();
        initializeSystem();
    }

    function exportImage() {
        if (p5inst) {
            p5inst.saveCanvas('synthetic-flux-' + params.seed, 'png');
        }
    }

    window.addEventListener('load', function () {
        updateSeedDisplay();
    });
    </script>
</body>
</html>
